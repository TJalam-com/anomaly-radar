[project]
name = "anomaly-radar"
version = "0.1.0"
description = "Anomaly Radar - read-only anomaly ranking over public Polymarket data"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pycryptodome>=3.23.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--basetemp=.pytest-tmp"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

